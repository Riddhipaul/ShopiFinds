services:
  - type: web
    name: reelshop-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GOOGLE_SHEET_ID     # Google Sheets as the database (recommended here) - see README
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DATABASE_URL        # Supabase/Neon Postgres URI - makes data survive restarts
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://YOUR-SITE.netlify.app
