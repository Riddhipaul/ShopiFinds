[build]
  command = "npm run build"
  publish = "dist"

# 1) Proxy API + masked short links to the Flask backend.
#    >>> Replace https://YOUR-BACKEND.onrender.com with your deployed Flask URL. <<<
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/go/*"
  to = "https://YOUR-BACKEND.onrender.com/go/:splat"
  status = 200
  force = true

# 2) Single-page-app fallback so /admin and /products work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
